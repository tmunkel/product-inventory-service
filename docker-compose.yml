services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: product_inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5433:5432"
    volumes:
      - inventory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d product_inventory"]
      interval: 5s
      retries: 10

volumes:
  inventory-db:
